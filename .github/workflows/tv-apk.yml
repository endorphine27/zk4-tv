name: TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Empty on purpose: no backend, Trakt, Simkl or MDBList keys are available here
      - name: Create empty local.properties
        run: touch local.properties

      - name: Compute app version
        run: echo "APP_VERSION=1.0.0-tv.$(printf '%04d' "${GITHUB_RUN_NUMBER}")" >> "$GITHUB_ENV"

      # A fresh signing key per build: no secrets are stored. Updating the app on the TV means
      # uninstalling the previous build first (Android refuses an update signed with a different key).
      - name: Create signing key
        run: |
          PW="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/tv.jks" -alias cineboxtv -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=CINEBOX TV, O=Personal, C=RO"
          echo "::add-mask::$PW"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=cineboxtv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$PW"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$PW"
          } >> "$GITHUB_ENV"

      - name: Build full debug APK
        run: ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find app/build/outputs/apk -name '*.apk' | grep -i full | head -n 1)"
          test -f "$apk"
          ls -lh "$apk"
          cp "$apk" "app-${APP_VERSION}.apk"
          gh release create "v${APP_VERSION}" "app-${APP_VERSION}.apk" --title "TV build ${GITHUB_RUN_NUMBER}" --notes "Debug-signed build." --prerelease
