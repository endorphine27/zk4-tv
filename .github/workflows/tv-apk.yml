name: TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Empty on purpose: no backend, Trakt, Simkl or MDBList keys are available here
      - name: Create empty local.properties
        run: touch local.properties

      - name: Compute app version
        run: |
          echo "APP_VERSION=1.0.0-tv.$(printf '%04d' "${GITHUB_RUN_NUMBER}")" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # One fixed signing key kept in the repo, so every build can be installed over the previous one.
      # It only identifies this personal app on your own TV; it is not a store key.
      - name: Use fixed signing key
        run: |
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/ci/cinebox-tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=cineboxtv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=cinebox-tv"
            echo "NUVIO_RELEASE_STORE_PASSWORD=cinebox-tv"
          } >> "$GITHUB_ENV"

      - name: Build full debug APK
        run: ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find app/build/outputs/apk -name '*.apk'
          apk="$(find app/build/outputs/apk -name '*.apk' | grep -i full | grep -i universal | head -n 1)"
          test -f "$apk"
          ls -lh "$apk"
          cp "$apk" "app-${APP_VERSION}.apk"
          gh release create "v${APP_VERSION}" "app-${APP_VERSION}.apk" --title "Build ${GITHUB_RUN_NUMBER}" --notes "Unsigned-store build." --latest
