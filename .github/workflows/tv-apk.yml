name: TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Empty on purpose: no backend, Trakt, Simkl or MDBList keys are available here
      - name: Create empty local.properties
        run: touch local.properties

      - name: Compute app version
        run: echo "APP_VERSION=1.0.0-tv.$(printf '%04d' "${GITHUB_RUN_NUMBER}")" >> "$GITHUB_ENV"

      - name: Build full debug APK
        run: ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find app/build/outputs/apk -name '*.apk' | grep -i full | head -n 1)"
          test -f "$apk"
          ls -lh "$apk"
          cp "$apk" "app-${APP_VERSION}.apk"
          gh release create "v${APP_VERSION}" "app-${APP_VERSION}.apk" --title "TV build ${GITHUB_RUN_NUMBER}" --notes "Debug-signed build." --prerelease
